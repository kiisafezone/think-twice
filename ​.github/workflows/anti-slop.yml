name: Anti-Slop Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  anti-slop-audit:
    name: Static Anti-Slop Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Anti-Slop Scanner
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys

          # High-confidence AI slop patterns
          RULES = [
              ("Stubbed Marker", r"\b(TODO|FIXME|XXX|HACK|PLACEHOLDER)\b"),
              ("Empty Catch Block", r"catch\s*(?:\([^)]*\))?\s*\{\s*\}"),
              ("Swallowed Promise Error", r"\.catch\(\s*\(\s*\w*\s*\)\s*=>\s*\{\s*\}\s*\)"),
              ("Python Silent Except", r"except(?:\s+\w+)?\s*:\s*pass\b"),
              ("NotImplemented Stub", r"\braise\s+NotImplementedError\b|throw\s+new\s+Error\(\s*['\"]Not implemented"),
              ("Console-Only UI Handler", r"on(?:Click|Submit|Change)\s*=\s*\{\s*\(\)\s*=>\s*console\.(?:log|warn)\("),
              ("Fake Success Return", r"return\s*\{\s*(?:ok|success)\s*:\s*true\s*,\s*data\s*:\s*(?:\[\s*\]|\{\s*\}|null)\s*\}"),
              ("Dummy / Mock Data Literal", r"\b(?:dummyData|mockData|fakeData|sampleItems|placeholderData)\b\s*="),
              ("Hardcoded Localhost URL", r"['\"]https?://(?:localhost|127\.0\.0\.1)(?::\d+)?"),
              ("Hardcoded Secret / API Key", r"(?:api[_-]?key|secret|token|password)\s*[:=]\s*['\"][A-Za-z0-9_\-]{16,}['\"]"),
          ]

          TARGET_EXTS = (".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".py", ".go", ".rs")
          EXCLUDE_DIRS = {
              ".git", "node_modules", ".next", "dist", "build",
              "__pycache__", ".venv", "venv", "coverage", ".turbo"
          }
          EXCLUDE_FILES = {"anti-slop.yml"}

          findings = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS]
              for filename in files:
                  if filename in EXCLUDE_FILES or not filename.endswith(TARGET_EXTS):
                      continue
                  # Skip test/spec files from mock/dummy checks
                  is_test = bool(re.search(r"(?:\.test\.|\.spec\.|__tests__|test_)", filename))
                  filepath = os.path.join(root, filename).lstrip("./")

                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      for line_no, line in enumerate(f, 1):
                          stripped = line.strip()
                          for rule_name, pattern in RULES:
                              if is_test and rule_name in ("Dummy / Mock Data Literal", "Hardcoded Localhost URL"):
                                  continue
                              if re.search(pattern, line, re.IGNORECASE if "Secret" in rule_name else 0):
                                  findings.append((filepath, line_no, rule_name, stripped[:100]))

          # Write GitHub Step Summary
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as s:
                  s.write("## Anti-Slop Audit Report\n\n")
                  if findings:
                      s.write(f"❌ **Failed:** Found **{len(findings)}** potential AI slop signature(s).\n\n")
                      s.write("| File | Line | Rule | Snippet |\n")
                      s.write("| :--- | :--- | :--- | :--- |\n")
                      for fp, ln, rn, snip in findings:
                          safe_snip = snip.replace("|", "\\|").replace("`", "'")
                          s.write(f"| `{fp}` | {ln} | **{rn}** | `{safe_snip}` |\n")
                  else:
                      s.write("✅ **Passed:** 0 AI slop signatures detected.\n")

          if findings:
              print(f"::error::Anti-Slop Gate failed with {len(findings)} issue(s).")
              for fp, ln, rn, snip in findings:
                  print(f"::warning file={fp},line={ln}::[{rn}] {snip}")
              sys.exit(1)

          print("Anti-Slop Gate Passed: 0 slop signatures detected.")
          EOF
